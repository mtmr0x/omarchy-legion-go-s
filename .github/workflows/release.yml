name: Release

# Publishes a GitHub release for every pushed v* tag, using the annotated tag
# message as the release notes. Cut releases locally with `make release`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout fetches the tag as a lightweight ref, which drops its message.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --list --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
